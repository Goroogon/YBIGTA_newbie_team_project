services:
  mysql:
    image: mysql:8
    container_name: mysql-ybigta
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: ybigta_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mongo:
    image: mongo:7
    container_name: mongo-ybigta
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data: